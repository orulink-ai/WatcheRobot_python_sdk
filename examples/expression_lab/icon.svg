<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Watcher Expression Lab</title>
  <desc id="description">Green procedural Watcher eyes on a dark circular display.</desc>
  <defs>
    <radialGradient id="display" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#152117"/>
      <stop offset="1" stop-color="#050806"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="236" fill="url(#display)" stroke="#253a29" stroke-width="12"/>
  <g fill="#a1f03c" filter="url(#glow)">
    <rect x="104" y="224" width="20" height="64" rx="10"/>
    <rect x="134" y="194" width="20" height="124" rx="10"/>
    <rect x="164" y="170" width="20" height="172" rx="10"/>
    <rect x="194" y="190" width="20" height="132" rx="10"/>
    <rect x="224" y="222" width="20" height="68" rx="10"/>
    <rect x="268" y="222" width="20" height="68" rx="10"/>
    <rect x="298" y="190" width="20" height="132" rx="10"/>
    <rect x="328" y="170" width="20" height="172" rx="10"/>
    <rect x="358" y="194" width="20" height="124" rx="10"/>
    <rect x="388" y="224" width="20" height="64" rx="10"/>
  </g>
  <path d="M364 122c13-21 46-14 46 12 0 24-46 52-46 52s-46-28-46-52c0-26 33-33 46-12z" fill="#a1f03c"/>
</svg>
