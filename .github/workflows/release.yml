name: Release Python package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      recover_tag:
        description: Existing release tag whose matching draft assets should resume production publication
        required: true
        type: string

concurrency:
  group: sdk-release-${{ inputs.recover_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  start-clean:
    name: Clean release workspace before use
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64, sdk-release]
    steps:
      - name: Remove files left by a previous release job
        shell: bash
        run: |
          workspace=$(realpath -m "${GITHUB_WORKSPACE}")
          [[ "${workspace}" == /opt/actions-runner-release/_work/* ]] || {
            echo "Refusing to clean unexpected workspace: ${workspace}" >&2
            exit 1
          }
          shopt -s dotglob nullglob
          rm -rf -- "${workspace}"/*

  gate:
    name: Validate release request
    if: github.event_name == 'push'
    needs: start-clean
    runs-on: [self-hosted, Linux, X64, sdk-release]
    outputs:
      version: ${{ steps.gate.outputs.version }}
      prerelease: ${{ steps.gate.outputs.prerelease }}
      commit: ${{ steps.gate.outputs.commit }}
      reuse-artifact: ${{ steps.gate.outputs.reuse-artifact }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install packaging==26.0
      - id: gate
        name: Validate tag, main ancestry, version PR and registries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_commit=$(git rev-list -n 1 "${GITHUB_REF_NAME}")
          gate_json=$(python tools/check_release_gate.py \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${GITHUB_REF_NAME}" \
            --sha "${tag_commit}")
          version=$(python -c 'import json,sys; print(json.load(sys.stdin)["version"])' <<< "${gate_json}")
          reuse_artifact=$(python -c 'import json,sys; print(str(json.load(sys.stdin)["reuse_artifact"]).lower())' <<< "${gate_json}")
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "commit=${tag_commit}" >> "${GITHUB_OUTPUT}"
          echo "reuse-artifact=${reuse_artifact}" >> "${GITHUB_OUTPUT}"
          python tools/check_release_version.py "${GITHUB_REF_NAME}"
          python -c 'from packaging.version import Version; import sys; print(f"prerelease={str(Version(sys.argv[1]).is_prerelease).lower()}")' "${version}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build immutable distributions
    needs: gate
    runs-on: [self-hosted, Linux, X64, sdk-release]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        if: needs.gate.outputs.reuse-artifact != 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        if: needs.gate.outputs.reuse-artifact != 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: needs.gate.outputs.reuse-artifact != 'true'
        run: python -m pip install --upgrade pip build twine
      - if: needs.gate.outputs.reuse-artifact != 'true'
        run: python -m pip install -e ".[test]"
      - if: needs.gate.outputs.reuse-artifact != 'true'
        run: python -m pytest
      - if: needs.gate.outputs.reuse-artifact != 'true'
        run: python -m mypy src/watcherobot
      - if: needs.gate.outputs.reuse-artifact != 'true'
        run: python -m build
      - if: needs.gate.outputs.reuse-artifact != 'true'
        run: python -m twine check dist/*
      - name: Verify wheel installation
        if: needs.gate.outputs.reuse-artifact != 'true'
        run: |
          python -m venv .venv-wheel-check
          .venv-wheel-check/bin/python -m pip install --force-reinstall dist/*.whl
          .venv-wheel-check/bin/python -m pip check
          .venv-wheel-check/bin/python -c "import watcherobot; assert watcherobot.__version__ == '${{ needs.gate.outputs.version }}'"
          .venv-wheel-check/bin/watcherobot --help
      - name: Record distribution hashes
        if: needs.gate.outputs.reuse-artifact != 'true'
        run: sha256sum dist/* > SHA256SUMS
      - name: Recover immutable distributions from the matching draft Release
        if: needs.gate.outputs.reuse-artifact == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern 'watcherobot-*' --dir dist
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern SHA256SUMS --dir .
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: watcherobot-${{ needs.gate.outputs.version }}-${{ github.run_attempt }}
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Create draft GitHub Release
    needs: [gate, build]
    runs-on: [self-hosted, Linux, X64, sdk-release]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: watcherobot-${{ needs.gate.outputs.version }}-${{ github.run_attempt }}
          path: artifact/
      - name: Create immutable draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_flag=()
          if [[ "${{ needs.gate.outputs.prerelease }}" == "true" ]]; then prerelease_flag=(--prerelease); fi
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Matching draft Release already exists; reusing it."
          else
            gh release create "${GITHUB_REF_NAME}" artifact/dist/* artifact/SHA256SUMS \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${{ needs.gate.outputs.commit }}" \
              --title "watcherobot ${{ needs.gate.outputs.version }}" \
              --generate-notes \
              --draft \
              "${prerelease_flag[@]}"
          fi

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [gate, build, draft-release]
    runs-on: [self-hosted, Linux, X64, sdk-release]
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: watcherobot-${{ needs.gate.outputs.version }}-${{ github.run_attempt }}
          path: artifact/
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Publish immutable distributions to TestPyPI with OIDC
        env:
          UV_PUBLISH_CHECK_URL: https://test.pypi.org/simple/
        run: >-
          uv publish
          --trusted-publishing always
          --publish-url https://test.pypi.org/legacy/
          artifact/dist/*

  verify-testpypi:
    name: Verify TestPyPI installation
    needs: [gate, build, publish-testpypi]
    runs-on: [self-hosted, Linux, X64, sdk-release]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: watcherobot-${{ needs.gate.outputs.version }}-${{ github.run_attempt }}
          path: artifact/
      - name: Install exact release from TestPyPI
        run: |
          python -m venv .venv-testpypi
          .venv-testpypi/bin/python -m pip install --index-url https://pypi.org/simple/ artifact/dist/*.whl
          .venv-testpypi/bin/python -m pip uninstall -y watcherobot
          for attempt in {1..12}; do
            if .venv-testpypi/bin/python -m pip download \
              --index-url https://test.pypi.org/simple/ \
              --no-deps --only-binary=:all: --dest testpypi-download \
              "watcherobot==${{ needs.gate.outputs.version }}"; then
              break
            fi
            if [[ "${attempt}" == "12" ]]; then exit 1; fi
            sleep 10
          done
          expected_wheel=$(find artifact/dist -maxdepth 1 -name '*.whl' -printf '%f\n')
          test "$(sha256sum "testpypi-download/${expected_wheel}" | cut -d' ' -f1)" = \
            "$(sha256sum "artifact/dist/${expected_wheel}" | cut -d' ' -f1)"
          .venv-testpypi/bin/python -m pip install --no-deps "testpypi-download/${expected_wheel}"
          .venv-testpypi/bin/python -m pip check
          .venv-testpypi/bin/python -c "import watcherobot; assert watcherobot.__version__ == '${{ needs.gate.outputs.version }}'"
          .venv-testpypi/bin/watcherobot --help

  publish-pypi:
    name: Publish to PyPI
    needs: [gate, build, verify-testpypi, draft-release]
    runs-on: [self-hosted, Linux, X64, sdk-release]
    environment:
      name: pypi
      url: https://pypi.org/p/watcherobot
    permissions:
      id-token: write
    if: needs.gate.outputs.prerelease == 'false'
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: watcherobot-${{ needs.gate.outputs.version }}-${{ github.run_attempt }}
          path: artifact/
      - name: Verify artifact hashes before production upload
        run: (cd artifact && sha256sum --check SHA256SUMS)
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Publish the original distributions to PyPI with OIDC
        run: uv publish --trusted-publishing always artifact/dist/*

  verify-pypi:
    name: Verify PyPI and publish GitHub Release
    needs: [gate, publish-pypi]
    runs-on: [self-hosted, Linux, X64, sdk-release]
    permissions:
      contents: write
    if: needs.gate.outputs.prerelease == 'false'
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install exact release from PyPI
        run: |
          python -m venv .venv-pypi
          for attempt in {1..12}; do
            if .venv-pypi/bin/python -m pip install "watcherobot==${{ needs.gate.outputs.version }}"; then break; fi
            if [[ "${attempt}" == "12" ]]; then exit 1; fi
            sleep 10
          done
          .venv-pypi/bin/python -m pip check
          .venv-pypi/bin/python -c "import watcherobot; assert watcherobot.__version__ == '${{ needs.gate.outputs.version }}'"
          .venv-pypi/bin/watcherobot --help
      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false

  finalize-prerelease:
    name: Publish verified TestPyPI prerelease
    needs: [gate, verify-testpypi]
    if: needs.gate.outputs.prerelease == 'true'
    runs-on: [self-hosted, Linux, X64, sdk-release]
    permissions:
      contents: write
    steps:
      - name: Publish GitHub prerelease after TestPyPI verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --prerelease

  finish-clean:
    name: Clean release workspace after use
    if: always() && github.event_name == 'push'
    needs: [gate, build, draft-release, publish-testpypi, verify-testpypi, publish-pypi, verify-pypi, finalize-prerelease]
    runs-on: [self-hosted, Linux, X64, sdk-release]
    steps:
      - name: Remove checked-out code, environments and downloaded artifacts
        shell: bash
        run: |
          workspace=$(realpath -m "${GITHUB_WORKSPACE}")
          [[ "${workspace}" == /opt/actions-runner-release/_work/* ]] || {
            echo "Refusing to clean unexpected workspace: ${workspace}" >&2
            exit 1
          }
          shopt -s dotglob nullglob
          rm -rf -- "${workspace}"/*

  recover-gate:
    name: Validate production recovery request
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, sdk-release]
    env:
      RECOVERY_DIR_NAME: watcherobot-recovery-${{ github.run_id }}-${{ github.run_attempt }}-gate
    outputs:
      version: ${{ steps.gate.outputs.version }}
      commit: ${{ steps.gate.outputs.commit }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - id: prepare
        name: Require a clean run-specific directory and main dispatch
        shell: bash
        run: |
          recovery_root="${RUNNER_TEMP}/${RECOVERY_DIR_NAME}"
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || {
            echo "Production recovery must be dispatched from main." >&2
            exit 1
          }
          [[ "${recovery_root}" == "${RUNNER_TEMP}"/watcherobot-recovery-* ]] || exit 1
          [[ ! -e "${recovery_root}" ]] || {
            echo "Refusing to reuse recovery directory: ${recovery_root}" >&2
            exit 1
          }
          mkdir -p "${recovery_root}/tools"
          echo "root=${recovery_root}" >> "${GITHUB_OUTPUT}"
      - name: Check out the current recovery implementation
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve recovery gate from main
        env:
          RECOVERY_ROOT: ${{ steps.prepare.outputs.root }}
        run: |
          cp tools/check_release_gate.py tools/check_release_version.py \
            "${RECOVERY_ROOT}/tools/"
      - name: Check out the immutable release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.recover_tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install packaging==26.0
      - id: gate
        name: Validate tag, merge commit and registries
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVER_TAG: ${{ inputs.recover_tag }}
          RECOVERY_ROOT: ${{ steps.prepare.outputs.root }}
        run: |
          tag_commit=$(git rev-list -n 1 "${RECOVER_TAG}")
          gate_json=$(python "${RECOVERY_ROOT}/tools/check_release_gate.py" \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${RECOVER_TAG}" \
            --sha "${tag_commit}" \
            --version-file "${GITHUB_WORKSPACE}/src/watcherobot/__init__.py" \
            --allow-existing-pypi \
            --defer-draft-validation)
          version=$(python -c 'import json,sys; print(json.load(sys.stdin)["version"])' <<< "${gate_json}")
          python -c 'from packaging.version import Version; import sys; raise SystemExit("Production recovery requires a stable version") if Version(sys.argv[1]).is_prerelease else None' "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "commit=${tag_commit}" >> "${GITHUB_OUTPUT}"
      - name: Remove gate recovery directory
        if: always()
        shell: bash
        env:
          RECOVERY_ROOT: ${{ steps.prepare.outputs.root }}
        run: |
          [[ "${RECOVERY_ROOT}" == "${RUNNER_TEMP}"/watcherobot-recovery-* ]] || exit 1
          rm -rf -- "${RECOVERY_ROOT}"

  recover-draft-assets:
    name: Read matching draft Release assets with isolated privilege
    needs: recover-gate
    runs-on: [self-hosted, Linux, X64, sdk-release]
    env:
      RECOVERY_DIR_NAME: watcherobot-recovery-${{ github.run_id }}-${{ github.run_attempt }}-draft
    permissions:
      contents: write
    steps:
      - id: prepare
        name: Require a clean run-specific draft directory
        shell: bash
        run: |
          recovery_root="${RUNNER_TEMP}/${RECOVERY_DIR_NAME}"
          [[ "${recovery_root}" == "${RUNNER_TEMP}"/watcherobot-recovery-* ]] || exit 1
          [[ ! -e "${recovery_root}" ]] || {
            echo "Refusing to reuse recovery directory: ${recovery_root}" >&2
            exit 1
          }
          mkdir -p "${recovery_root}/artifact/dist"
          echo "root=${recovery_root}" >> "${GITHUB_OUTPUT}"
      - id: assets
        name: Require the exact matching draft and download its assets
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVER_TAG: ${{ inputs.recover_tag }}
          RECOVERY_ROOT: ${{ steps.prepare.outputs.root }}
          VERSION: ${{ needs.recover-gate.outputs.version }}
          TAG_COMMIT: ${{ needs.recover-gate.outputs.commit }}
        run: |
          metadata=$(gh release view "${RECOVER_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json tagName,targetCommitish,isDraft \
            --jq '[.tagName,.targetCommitish,(.isDraft|tostring)] | @tsv')
          IFS=$'\t' read -r release_tag release_commit release_draft <<< "${metadata}"
          [[ "${release_tag}" == "${RECOVER_TAG}" \
            && "${release_commit}" == "${TAG_COMMIT}" \
            && "${release_draft}" == "true" ]] || {
            echo "Production recovery requires the exact matching draft Release." >&2
            exit 1
          }
          gh release download "${RECOVER_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "watcherobot-${VERSION}*" --dir "${RECOVERY_ROOT}/artifact/dist"
          gh release download "${RECOVER_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern SHA256SUMS --dir "${RECOVERY_ROOT}/artifact"
          echo "root=${RECOVERY_ROOT}/artifact" >> "${GITHUB_OUTPUT}"
      - name: Preserve draft distributions for unprivileged verification
        uses: actions/upload-artifact@v7
        with:
          name: watcherobot-recovery-${{ needs.recover-gate.outputs.version }}-${{ github.run_id }}
          path: |
            ${{ steps.assets.outputs.root }}/dist/
            ${{ steps.assets.outputs.root }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Remove draft recovery directory
        if: always()
        shell: bash
        env:
          RECOVERY_ROOT: ${{ steps.prepare.outputs.root }}
        run: |
          [[ "${RECOVERY_ROOT}" == "${RUNNER_TEMP}"/watcherobot-recovery-* ]] || exit 1
          rm -rf -- "${RECOVERY_ROOT}"

  recover-publish-pypi:
    name: Resume publication to PyPI from immutable draft assets
    needs: [recover-gate, recover-draft-assets]
    runs-on: [self-hosted, Linux, X64, sdk-release]
    env:
      RECOVERY_DIR_NAME: watcherobot-recovery-${{ github.run_id }}-${{ github.run_attempt }}-publish
    environment:
      name: pypi
      url: https://pypi.org/p/watcherobot
    permissions:
      contents: read
      id-token: write
    steps:
      - id: prepare
        name: Require a clean run-specific publish directory
        shell: bash
        run: |
          recovery_root="${RUNNER_TEMP}/${RECOVERY_DIR_NAME}"
          [[ "${recovery_root}" == "${RUNNER_TEMP}"/watcherobot-recovery-* ]] || exit 1
          [[ ! -e "${recovery_root}" ]] || {
            echo "Refusing to reuse recovery directory: ${recovery_root}" >&2
            exit 1
          }
          mkdir -p "${recovery_root}/artifact"
          echo "root=${recovery_root}" >> "${GITHUB_OUTPUT}"
      - name: Check out the approved recovery validator
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install packaging==26.0
      - name: Download only the verified recovery artifact
        uses: actions/download-artifact@v8
        with:
          name: watcherobot-recovery-${{ needs.recover-gate.outputs.version }}-${{ github.run_id }}
          path: ${{ steps.prepare.outputs.root }}/artifact
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Publish only the original distributions to PyPI with OIDC
        env:
          UV_PUBLISH_CHECK_URL: https://pypi.org/simple/
          RECOVERY_VALIDATOR: ${{ github.workspace }}/tools/verify_release_artifacts.py
          RECOVERY_ROOT: ${{ steps.prepare.outputs.root }}
          VERSION: ${{ needs.recover-gate.outputs.version }}
        run: |
          mapfile -t distributions < <(python "${RECOVERY_VALIDATOR}" \
            --root "${RECOVERY_ROOT}/artifact" \
            --version "${VERSION}" \
            --registry-json-url "https://test.pypi.org/pypi/watcherobot/${VERSION}/json" \
            --registry-name TestPyPI \
            --print-paths)
          [[ "${#distributions[@]}" == "2" ]] || exit 1
          uv publish --trusted-publishing always "${distributions[@]}"
      - name: Remove publish recovery directory
        if: always()
        shell: bash
        env:
          RECOVERY_ROOT: ${{ steps.prepare.outputs.root }}
        run: |
          [[ "${RECOVERY_ROOT}" == "${RUNNER_TEMP}"/watcherobot-recovery-* ]] || exit 1
          rm -rf -- "${RECOVERY_ROOT}"

  recover-verify-pypi:
    name: Verify recovered PyPI release and publish GitHub Release
    needs: [recover-gate, recover-publish-pypi]
    runs-on: [self-hosted, Linux, X64, sdk-release]
    env:
      RECOVERY_DIR_NAME: watcherobot-recovery-${{ github.run_id }}-${{ github.run_attempt }}-verify
    permissions:
      contents: write
    steps:
      - id: prepare
        name: Require a clean run-specific verification directory
        shell: bash
        run: |
          recovery_root="${RUNNER_TEMP}/${RECOVERY_DIR_NAME}"
          [[ "${recovery_root}" == "${RUNNER_TEMP}"/watcherobot-recovery-* ]] || exit 1
          [[ ! -e "${recovery_root}" ]] || {
            echo "Refusing to reuse recovery directory: ${recovery_root}" >&2
            exit 1
          }
          mkdir -p "${recovery_root}/artifact"
          echo "root=${recovery_root}" >> "${GITHUB_OUTPUT}"
      - name: Check out the approved production verifier
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install packaging==26.0
      - name: Download the verified recovery artifact for production comparison
        uses: actions/download-artifact@v8
        with:
          name: watcherobot-recovery-${{ needs.recover-gate.outputs.version }}-${{ github.run_id }}
          path: ${{ steps.prepare.outputs.root }}/artifact
      - name: Verify the complete PyPI distribution set and hashes
        env:
          RECOVERY_ROOT: ${{ steps.prepare.outputs.root }}
          VERSION: ${{ needs.recover-gate.outputs.version }}
        run: |
          for attempt in {1..12}; do
            if python tools/verify_release_artifacts.py \
              --root "${RECOVERY_ROOT}/artifact" \
              --version "${VERSION}" \
              --registry-json-url "https://pypi.org/pypi/watcherobot/${VERSION}/json" \
              --registry-name PyPI; then break; fi
            if [[ "${attempt}" == "12" ]]; then exit 1; fi
            sleep 10
          done
      - name: Force a clean installation of the exact recovered release from PyPI
        env:
          RECOVERY_ROOT: ${{ steps.prepare.outputs.root }}
          VERSION: ${{ needs.recover-gate.outputs.version }}
        run: |
          python -m venv "${RECOVERY_ROOT}/venv"
          for attempt in {1..12}; do
            if "${RECOVERY_ROOT}/venv/bin/python" -m pip install \
              --force-reinstall \
              --no-cache-dir \
              --index-url https://pypi.org/simple/ \
              "watcherobot==${VERSION}"; then break; fi
            if [[ "${attempt}" == "12" ]]; then exit 1; fi
            sleep 10
          done
          "${RECOVERY_ROOT}/venv/bin/python" -m pip check
          "${RECOVERY_ROOT}/venv/bin/python" -c "import watcherobot; assert watcherobot.__version__ == '${VERSION}'"
          "${RECOVERY_ROOT}/venv/bin/watcherobot" --help
      - name: Publish the verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVER_TAG: ${{ inputs.recover_tag }}
        run: gh release edit "${RECOVER_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
      - name: Remove production verification directory
        if: always()
        shell: bash
        env:
          RECOVERY_ROOT: ${{ steps.prepare.outputs.root }}
        run: |
          [[ "${RECOVERY_ROOT}" == "${RUNNER_TEMP}"/watcherobot-recovery-* ]] || exit 1
          rm -rf -- "${RECOVERY_ROOT}"

  recover-finish-clean:
    name: Clean recovery workspace after use
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [recover-gate, recover-draft-assets, recover-publish-pypi, recover-verify-pypi]
    runs-on: [self-hosted, Linux, X64, sdk-release]
    steps:
      - name: Remove checked-out code, environments and downloaded artifacts
        shell: bash
        run: |
          workspace=$(realpath -m "${GITHUB_WORKSPACE}")
          [[ "${workspace}" == /opt/actions-runner-release/_work/* ]] || {
            echo "Refusing to clean unexpected workspace: ${workspace}" >&2
            exit 1
          }
          shopt -s dotglob nullglob
          rm -rf -- "${workspace}"/*
