name: Python SDK Hardware HIL

on:
  workflow_dispatch:
    inputs:
      ble_id_prefix:
        description: Unique BLE device ID or MAC prefix, for example 80:B5
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: watcher-python-sdk-hil
  cancel-in-progress: false

jobs:
  ble-readonly:
    name: BLE discovery and provisioning status
    runs-on: [self-hosted, Windows, X64, watcher-hil]
    environment: hardware-hil
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install SDK in an isolated environment
        run: python -m pip install -e ".[test]"
      - name: Scan for the physical robot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          python tools/ble_provisioning_hardware_test.py --scan-timeout 15 scan 2>&1 |
            Tee-Object -FilePath artifacts/ble-scan.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Read provisioning status without changing credentials
        shell: pwsh
        env:
          BLE_ID_PREFIX: ${{ inputs.ble_id_prefix }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BLE_ID_PREFIX)) {
            throw "ble_id_prefix must not be empty."
          }
          python tools/ble_provisioning_hardware_test.py --scan-timeout 15 status `
            --id-prefix $env:BLE_ID_PREFIX 2>&1 |
            Tee-Object -FilePath artifacts/ble-status.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload hardware evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-sdk-hil-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
