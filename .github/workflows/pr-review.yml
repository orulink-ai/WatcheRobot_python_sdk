name: PR Review by Luxiao

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: [self-hosted, Linux, X64, pr-review]
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract PR Diff
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1 2>/dev/null || true
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.diff 2>/dev/null || git diff HEAD~1 > /tmp/pr.diff
          echo "diff_lines=$(wc -l < /tmp/pr.diff)" >> $GITHUB_OUTPUT

      - name: Call Luxiao Agent
        id: review
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_BODY="${{ github.event.pull_request.body }}"
          DIFF=$(cat /tmp/pr.diff)
          ADDITIONS="${{ github.event.pull_request.additions }}"
          DELETIONS="${{ github.event.pull_request.deletions }}"
          FILES="${{ github.event.pull_request.changed_files }}"

          # Build the review prompt
          cat > /tmp/review_prompt.txt << 'PROMPT'
请审查以下 Pull Request。按照你的审查框架（架构、产品、规范、损伤 + 意图分析 + Merge 建议）给出完整审查报告。

## PR 信息

- 标题: $PR_TITLE
- 描述: $PR_BODY
- 变更: $FILES 个文件, +$ADDITIONS / -$DELETIONS

## 代码 Diff

PROMPT
          echo "\`\`\`diff" >> /tmp/review_prompt.txt
          cat /tmp/pr.diff >> /tmp/review_prompt.txt
          echo "\`\`\`" >> /tmp/review_prompt.txt

          # Call Luxiao via SSH
          REVIEW_PROMPT=$(cat /tmp/review_prompt.txt | base64 -w0)
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes hermesadmin@192.168.1.116 \
            "echo '$REVIEW_PROMPT' | base64 -d | hermes -p luxiao-engineer chat -q - 2>&1" > /tmp/review_result.txt 2>&1

          echo "review_ready=true" >> $GITHUB_OUTPUT

      - name: Post Review Comment
        if: steps.review.outputs.review_ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          # Extract the review from hermes output (skip the preamble)
          python3 -c "
import sys
text = open('/tmp/review_result.txt').read()
# Find the review section
if '## 🤖 PR 审查报告' in text:
    idx = text.index('## 🤖 PR 审查报告')
    review = text[idx:]
elif '🤖 PR 审查报告' in text:
    idx = text.index('🤖 PR 审查报告')
    review = text[idx:]
else:
    # Fallback: use the last 2000 chars
    review = text[-2000:]
print(review)
" > /tmp/review_clean.md 2>/dev/null || cp /tmp/review_result.txt /tmp/review_clean.md

          # Delete old bot comments
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" --jq '.[].id' | while read cid; do
            BODY=$(gh api "repos/$REPO/issues/comments/$cid" --jq '.body')
            if echo "$BODY" | grep -q "PR 审查报告"; then
              gh api "repos/$REPO/issues/comments/$cid" -X DELETE
            fi
          done

          gh pr comment $PR_NUMBER --body "$(cat /tmp/review_clean.md)"
