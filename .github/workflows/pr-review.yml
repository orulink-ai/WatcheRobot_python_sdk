name: PR Review by Luxiao

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: [self-hosted, Linux, X64, pr-review]
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract PR Diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.diff 2>/dev/null || echo "empty" > /tmp/pr.diff
          echo "Diff lines: $(wc -l < /tmp/pr.diff)"

      - name: Run Luxiao Review
        run: |
          python3 /home/opsadmin/scripts/luxiao-review.py \
            "${{ github.event.pull_request.title }}" \
            "${{ github.event.pull_request.body }}" \
            "${{ github.event.pull_request.additions }}" \
            "${{ github.event.pull_request.deletions }}" \
            "${{ github.event.pull_request.changed_files }}" \
            /tmp/pr.diff \
            /tmp/review_result.md

      - name: Post Review Comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s /tmp/review_result.md ]; then
            echo "## 🤖 Luxiao PR 审查报告" > /tmp/review_result.md
            echo "" >> /tmp/review_result.md
            echo "⚠️ Review agent did not produce output." >> /tmp/review_result.md
          fi
          gh pr comment ${{ github.event.pull_request.number }} --body "$(cat /tmp/review_result.md)"
