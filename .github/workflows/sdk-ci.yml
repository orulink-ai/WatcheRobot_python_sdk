name: SDK CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: sdk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  development:
    name: Development checks
    if: >-
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'release:version')
    runs-on: [self-hosted, Linux, X64, sdk-ci]
    steps:
      - name: Clean workspace before snapshot download
        run: |
          workspace=$(realpath -m "${GITHUB_WORKSPACE}")
          runner_work=$(realpath -m "${RUNNER_TEMP}/..")
          [[ "${workspace}" == "${runner_work}"/*/* ]] || {
            echo "Refusing to clean unexpected CI workspace: ${workspace}" >&2
            exit 1
          }
          shopt -s dotglob nullglob
          rm -rf -- "${workspace}"/*

      - name: Download immutable source snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --show-error --location \
            --retry 5 --retry-connrefused \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            --output "${RUNNER_TEMP}/source.tar.gz"
          tar --extract --gzip --strip-components=1 \
            --file "${RUNNER_TEMP}/source.tar.gz"

      - uses: actions/setup-python@v6
        with:
          # Development CI intentionally uses one representative runtime.
          # mypy's python_version remains 3.10 to guard the minimum syntax/API contract.
          python-version: "3.11"
          cache: pip

      - name: Create isolated virtual environment
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install SDK, test, and packaging dependencies
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e ".[test]"

      - name: Validate development behavior
        run: |
          python -m pip check
          python -m pytest
          python -m mypy src/watcherobot

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate vision debug lab browser helpers
        run: node --test tests/js/*.mjs

      - name: Validate BLE fake backend contract
        run: |
          python -c "from watcherobot.provisioning.bleak_backend import BleakBackend; print(BleakBackend)"
          python -m pytest tests/provisioning

      - name: Build distributions
        # Building is deliberately independent of Git history and tags.
        run: |
          python -m build
          python -m twine check dist/*

      - name: Verify wheel installation
        run: |
          python -m venv .venv-wheel-check
          .venv-wheel-check/bin/python -m pip install --force-reinstall dist/*.whl
          .venv-wheel-check/bin/python -m pip check
          .venv-wheel-check/bin/python -c "import watcherobot; print(watcherobot.__version__)"
          .venv-wheel-check/bin/watcherobot --help

  release-compatibility:
    name: Python ${{ matrix.python-version }} / ${{ matrix.dependency-profile }}
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'release:version')
    runs-on: [self-hosted, Linux, X64, sdk-ci]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        dependency-profile: ["lowest", "latest"]
    steps:
      - name: Clean workspace before release snapshot download
        run: |
          workspace=$(realpath -m "${GITHUB_WORKSPACE}")
          runner_work=$(realpath -m "${RUNNER_TEMP}/..")
          [[ "${workspace}" == "${runner_work}"/*/* ]] || {
            echo "Refusing to clean unexpected CI workspace: ${workspace}" >&2
            exit 1
          }
          shopt -s dotglob nullglob
          rm -rf -- "${workspace}"/*

      - name: Download immutable release candidate snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --show-error --location \
            --retry 5 --retry-connrefused \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            --output "${RUNNER_TEMP}/source.tar.gz"
          tar --extract --gzip --strip-components=1 \
            --file "${RUNNER_TEMP}/source.tar.gz"

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Create isolated compatibility environment
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install SDK and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Select minimum supported runtime dependencies
        if: matrix.dependency-profile == 'lowest'
        run: |
          python -m pip install \
            "av==16.*" \
            "bleak==3.*" \
            "esptool==4.8.*" \
            "fastapi==0.129.*" \
            "huggingface-hub==1.26.*" \
            "keyring==25.7.*" \
            "packaging==24.*" \
            "Pillow==11.*" \
            "psutil==5.9.*" \
            "pyserial==3.5.*" \
            "starlette==0.51.*" \
            "uvicorn==0.30.*" \
            "websockets==14.*"

      - name: Select latest supported runtime dependencies
        if: matrix.dependency-profile == 'latest'
        run: |
          python -m pip install \
            "fastapi>=0.129,<1" \
            "starlette>=0.51,<1" \
            "websockets>=14,<16"

      - name: Validate release compatibility
        run: |
          python -m pip check
          python -m pytest
          python -m mypy src/watcherobot

      - name: Build and install release candidate distributions once
        if: matrix.python-version == '3.12' && matrix.dependency-profile == 'latest'
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
          python -m venv .venv-wheel-check
          .venv-wheel-check/bin/python -m pip install --force-reinstall dist/*.whl
          .venv-wheel-check/bin/python -m pip check
          .venv-wheel-check/bin/watcherobot --help
