name: SDK CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: sdk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  development:
    name: Full SDK, Daemon and media contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install SDK and CI dependencies
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e ".[test]"
      - name: Run Python functional and routing contracts
        run: |
          mkdir -p artifacts
          python -m pip check
          python -m pytest --junitxml=artifacts/pytest.xml
      - name: Run minimum-runtime type contract
        shell: bash
        run: |
          set -o pipefail
          # These two optional imports gain/lose inline typing across supported
          # dependency releases, so unused-ignore is not a stable CI signal.
          python -m mypy src/watcherobot --disable-error-code unused-ignore 2>&1 | tee artifacts/mypy.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"
      - name: Run fixed-Node media and vision browser contracts
        run: node --test tests/js/*.mjs
      - name: Build wheel and source distribution
        run: |
          python -m build
          python -m twine check dist/*
          sha256sum dist/* > artifacts/SHA256SUMS
      - name: Verify both CLIs from a clean wheel environment
        run: |
          python -m venv .venv-wheel-check
          .venv-wheel-check/bin/python -m pip install --force-reinstall dist/*.whl
          .venv-wheel-check/bin/python -m pip check
          .venv-wheel-check/bin/python -c "import watcherobot; print(watcherobot.__version__)"
          .venv-wheel-check/bin/watcherobot --help
          .venv-wheel-check/bin/watcher-distribution --help
      - name: Upload test reports and distributions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-sdk-evidence-${{ github.sha }}
          path: |
            artifacts/
            dist/
          if-no-files-found: warn
          retention-days: 14

  compatibility:
    name: Python ${{ matrix.python-version }} / ${{ matrix.dependency-profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            dependency-profile: lowest
          - python-version: "3.10"
            dependency-profile: latest
          - python-version: "3.11"
            dependency-profile: latest
          - python-version: "3.12"
            dependency-profile: latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install SDK and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Select minimum supported dependencies
        if: matrix.dependency-profile == 'lowest'
        run: |
          python -m pip install \
            "av==16.*" "bleak==3.*" "esptool==4.8.*" \
            "fastapi==0.129.*" "huggingface-hub==1.26.*" \
            "keyring==25.7.*" "packaging==24.*" "Pillow==11.*" \
            "psutil==5.9.*" "pyserial==3.5.*" "starlette==0.51.*" \
            "uvicorn==0.30.*" "websockets==14.*"
      - name: Run compatibility suite
        run: |
          mkdir -p artifacts
          python -m pip check
          python -m pytest --junitxml="artifacts/pytest-${{ matrix.python-version }}-${{ matrix.dependency-profile }}.xml"
      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-${{ matrix.python-version }}-${{ matrix.dependency-profile }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  cross-platform:
    name: Paths and CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # Keep subprocess logs deterministic on Windows runners with a legacy
      # active code page; product CLI output and tests are UTF-8.
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install SDK and tests
        run: python -m pip install -e ".[test]"
      - name: Validate project paths, public CLI and Application bootstrap
        run: >-
          python -m pytest
          tests/application/test_project_init.py
          tests/test_cli_runtime.py
          tests/test_documentation.py
          tests/test_removed_legacy_api.py

  changed-code-quality:
    name: Ruff correctness and formatting ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned Ruff range
        run: python -m pip install "ruff>=0.16,<0.17"
      - name: Check changed Python files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            diff_range="origin/${{ github.base_ref }}...HEAD"
          else
            diff_range="HEAD^...HEAD"
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "${diff_range}" | grep -E '\.py$' || true)
          if (( ${#files[@]} > 0 )); then
            python -m ruff check "${files[@]}"
            python -m ruff format --check "${files[@]}"
          fi
