name: SDK CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: sdk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# WARNING: snapshot jobs intentionally have no .git directory. Keep the three
# identical download blocks aligned when changing headers, retries, or extraction.
jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.dependency-profile }}
    runs-on: [self-hosted, Linux, X64, sdk-ci]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        dependency-profile: ["lowest", "latest"]
    steps:
      - name: Clean workspace before snapshot download
        run: |
          workspace=$(realpath -m "${GITHUB_WORKSPACE}")
          runner_work=$(realpath -m "${RUNNER_TEMP}/..")
          [[ "${workspace}" == "${runner_work}"/*/* ]] || {
            echo "Refusing to clean unexpected CI workspace: ${workspace}" >&2
            exit 1
          }
          shopt -s dotglob nullglob
          rm -rf -- "${workspace}"/*

      - name: Download immutable source snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --show-error --location \
            --retry 5 --retry-connrefused \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            --output "${RUNNER_TEMP}/source.tar.gz"
          tar --extract --gzip --strip-components=1 \
            --file "${RUNNER_TEMP}/source.tar.gz"

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Create isolated virtual environment
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install SDK and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Select minimum supported runtime dependencies
        if: matrix.dependency-profile == 'lowest'
        run: |
          python -m pip install \
            "av==16.*" \
            "bleak==3.*" \
            "esptool==4.8.*" \
            "fastapi==0.129.*" \
            "huggingface-hub==1.26.*" \
            "keyring==25.7.*" \
            "packaging==24.*" \
            "Pillow==11.*" \
            "psutil==5.9.*" \
            "pyserial==3.5.*" \
            "starlette==0.51.*" \
            "uvicorn==0.30.*" \
            "websockets==14.*"

      - name: Select latest supported runtime dependencies
        if: matrix.dependency-profile == 'latest'
        run: |
          python -m pip install \
            "fastapi>=0.129,<1" \
            "starlette>=0.51,<1" \
            "websockets>=14,<16"

      - run: python -m pip check
      - run: python -m pytest
      - run: python -m mypy src/watcherobot

  ble-provisioning:
    name: BLE fake backend
    # CI executes on company-owned runners by policy. This Linux contract test
    # covers the fake backend without reintroducing GitHub-hosted runners.
    runs-on: [self-hosted, Linux, X64, sdk-ci]
    steps:
      - name: Clean workspace before snapshot download
        run: |
          workspace=$(realpath -m "${GITHUB_WORKSPACE}")
          runner_work=$(realpath -m "${RUNNER_TEMP}/..")
          [[ "${workspace}" == "${runner_work}"/*/* ]] || {
            echo "Refusing to clean unexpected CI workspace: ${workspace}" >&2
            exit 1
          }
          shopt -s dotglob nullglob
          rm -rf -- "${workspace}"/*

      - name: Download immutable source snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --show-error --location \
            --retry 5 --retry-connrefused \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            --output "${RUNNER_TEMP}/source.tar.gz"
          tar --extract --gzip --strip-components=1 \
            --file "${RUNNER_TEMP}/source.tar.gz"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Create isolated virtual environment
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -e ".[test]"
      - run: python -m pip check
      - run: python -c "from watcherobot.provisioning.bleak_backend import BleakBackend; print(BleakBackend)"
      - run: python -m pytest tests/provisioning

  build:
    name: Build distributions
    needs: [test, ble-provisioning]
    runs-on: [self-hosted, Linux, X64, sdk-ci]
    steps:
      # The package uses Hatch's explicit src/watcherobot/__init__.py version
      # source. Building is deliberately independent of Git history and tags.
      - name: Clean workspace before snapshot download
        run: |
          workspace=$(realpath -m "${GITHUB_WORKSPACE}")
          runner_work=$(realpath -m "${RUNNER_TEMP}/..")
          [[ "${workspace}" == "${runner_work}"/*/* ]] || {
            echo "Refusing to clean unexpected CI workspace: ${workspace}" >&2
            exit 1
          }
          shopt -s dotglob nullglob
          rm -rf -- "${workspace}"/*

      - name: Download immutable source snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --show-error --location \
            --retry 5 --retry-connrefused \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            --output "${RUNNER_TEMP}/source.tar.gz"
          tar --extract --gzip --strip-components=1 \
            --file "${RUNNER_TEMP}/source.tar.gz"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Create isolated virtual environment
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify wheel installation
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
          python -c "import watcherobot; print(watcherobot.__version__)"
