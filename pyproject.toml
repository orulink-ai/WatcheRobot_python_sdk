[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "watcherobot"
dynamic = ["version"]
description = "Python SDK for managed WatcheRobot Applications with a bundled Runtime/Daemon"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Orulink AI"}]
dependencies = [
  "bleak>=3,<4",
  "av>=16,<17",
  "fastapi>=0.129,<1",
  "keyring>=25.7,<26",
  "packaging>=24,<27",
  "psutil>=5.9,<8",
  "starlette>=0.51,<1",
  "uvicorn>=0.30,<1",
  "websockets>=14,<16",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/orulink-ai/WatcheRobot_python_sdk"
Repository = "https://github.com/orulink-ai/WatcheRobot_python_sdk"
Documentation = "https://github.com/orulink-ai/WatcheRobot_python_sdk#readme"
Issues = "https://github.com/orulink-ai/WatcheRobot_python_sdk/issues"

[project.scripts]
watcherobot = "watcherobot.cli:main"

[project.optional-dependencies]
test = [
  "httpx>=0.25,<1",
  "mypy>=1.10,<2",
  "pytest>=8",
  "types-psutil>=5.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/watcherobot"]

[tool.hatch.version]
path = "src/watcherobot/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
files = ["src/watcherobot"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
